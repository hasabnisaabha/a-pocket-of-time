<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCQ Study</title>
<style>
body{margin:0;background:#f6f4f0;color:#171717;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:760px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dedbd5;border-radius:18px;padding:18px;margin:12px 0}input,button{font:inherit;border-radius:11px;padding:12px;border:1px solid #ddd;width:100%;margin:5px 0}button{background:#171717;color:#fff;border:0;font-weight:700}.hidden{display:none}.muted{color:#777}.q{font-size:20px;line-height:1.4}.opt{padding:14px;border:1px solid #ddd;border-radius:12px;margin:8px 0}.good{background:#e9f6ed}.bad{background:#fff0f0}.channel{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ddd;padding:13px 0}.channel button{width:auto}
</style>
</head><body><main>
<h1>MCQ Study</h1><p class="muted">Your Telegram questions, in one study place.</p>
<section id="login" class="card"><h2>Connect Telegram</h2><p class="muted">Enter the API ID and API hash from Telegram, then connect your account.</p><input id="apiId" placeholder="API ID"><input id="apiHash" placeholder="API hash"><button id="start">Connect</button><div id="auth" class="hidden"><input id="phone" placeholder="+91..."><button id="sendPhone">Send login code</button><input id="code" class="hidden" placeholder="Telegram login code"><button id="checkCode" class="hidden">Verify code</button><input id="password" class="hidden" type="password" placeholder="Telegram 2FA password"><button id="checkPassword" class="hidden">Verify password</button></div><p id="status"></p></section>
<section id="app" class="hidden"><div class="card"><h2>Channels</h2><button onclick="loadChannels()">Refresh channels</button><div id="channelList"></div></div><div class="card"><h2>Quiz</h2><button onclick="startQuiz()">Start quiz</button><div id="quizArea"></div></div><div class="card"><h2>Question bank</h2><div id="bank"></div></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@awesomegram/tdweb@1.8.40/dist/tdweb.js"></script>
<script>
const TdClient=window.tdweb&&(window.tdweb.default||window.tdweb);let td=null,chats=[],questions=JSON.parse(localStorage.getItem('mcqStudyQuestions')||'[]');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function st(x){$('status').textContent=x}function save(){localStorage.setItem('mcqStudyQuestions',JSON.stringify(questions))}
$('start').onclick=()=>{if(!TdClient)return st('Telegram client failed to load. Refresh and try again.');let id=Number($('apiId').value),hash=$('apiHash').value;if(!id||!hash)return st('Enter API ID and API hash.');$('auth').classList.remove('hidden');$('start').disabled=true;td=new TdClient({instanceName:'mcq-study',useDatabase:true,logVerbosityLevel:1,jsLogVerbosityLevel:'error',onUpdate});st('Enter your Telegram phone number.')};
async function send(q){return td.send(q)}
async function onUpdate(u){if(u['@type']!=='updateAuthorizationState')return;let s=u.authorization_state['@type'];try{if(s==='authorizationStateWaitTdlibParameters')await send({'@type':'setTdlibParameters','parameters':{use_test_dc:false,database_directory:'mcq-study',use_message_database:true,use_secret_chats:false,api_id:Number($('apiId').value),api_hash:$('apiHash').value,system_language_code:navigator.language||'en',device_model:'MCQ Study',system_version:navigator.userAgent,application_version:'1.0',enable_storage_optimizer:true}});else if(s==='authorizationStateWaitEncryptionKey')await send({'@type':'checkDatabaseEncryptionKey'});else if(s==='authorizationStateWaitPhoneNumber')st('Enter your phone number and tap Send login code.');else if(s==='authorizationStateWaitCode'){$('code').classList.remove('hidden');$('checkCode').classList.remove('hidden');st('Telegram sent a login code.');}else if(s==='authorizationStateWaitPassword'){$('password').classList.remove('hidden');$('checkPassword').classList.remove('hidden');st('Enter your Telegram 2FA password.');}else if(s==='authorizationStateReady'){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadChannels()}}catch(e){st('Telegram error: '+(e.message||e))}}
$('sendPhone').onclick=async()=>{try{await send({'@type':'setAuthenticationPhoneNumber','phone_number':$('phone').value.trim(),'settings':{'@type':'phoneNumberAuthenticationSettings','allow_flash_call':false,'allow_missed_call':false,'is_current_phone_number':true,'allow_sms_retriever_api':false}})}catch(e){st(e.message)}};$('checkCode').onclick=async()=>{try{await send({'@type':'checkAuthenticationCode','code':$('code').value.trim()})}catch(e){st(e.message)}};$('checkPassword').onclick=async()=>{try{await send({'@type':'checkAuthenticationPassword','password':$('password').value})}catch(e){st(e.message)}};
async function loadChannels(){try{let r=await send({'@type':'getChats','chat_list':{'@type':'chatListMain'},'limit':200,'offset_order':'9223372036854775807','offset_chat_id':0});chats=[];for(let id of r.chat_ids||[]){let c=await send({'@type':'getChat','chat_id':id});if(c.type&&c.type['@type']==='chatTypeSupergroup'&&c.type.is_channel)chats.push(c)}$('channelList').innerHTML=chats.map((c,i)=>`<div class="channel"><b>${esc(c.title)}</b><button onclick="importChannel(${i})">Import</button></div>`).join('')||'<p class="muted">No channels found.</p>'}catch(e){$('channelList').textContent=e.message}}
function parse(t){let m=(t||'').replace(/\r/g,'').match(/([\s\S]+?)\n\s*A[).:\-]\s*([\s\S]+?)\n\s*B[).:\-]\s*([\s\S]+?)\n\s*C[).:\-]\s*([\s\S]+?)\n\s*D[).:\-]\s*([\s\S]+?)(?=\n(?:Answer|Ans|Correct answer|Explanation)\b|$)/i);if(!m)return null;let a=(t.match(/(?:Answer|Ans|Correct answer)\s*[:\-]\s*([ABCD1-4])\b/i)||[])[1]||'';return{question:m[1].trim(),options:[m[2].trim(),m[3].trim(),m[4].trim(),m[5].trim()],answer:a.toUpperCase()}}
async function importChannel(i){let c=chats[i];if(c.has_protected_content)return alert('Telegram marks this channel as protected, so I will not bypass that protection.');let r=await send({'@type':'getChatHistory','chat_id':c.id,'from_message_id':0,'offset':0,'limit':100,'only_local':false}),n=0;for(let m of r.messages||[]){let t=m.content&&m.content['@type']==='messageText'?m.content.text.text:'';let p=parse(t);if(p&&!questions.some(x=>x.key===c.id+':'+m.id)){questions.push({key:c.id+':'+m.id,source:c.title,...p});n++}}save();render();alert('Imported '+n+' MCQs.')}
function render(){$('bank').innerHTML=questions.map(x=>`<div class="card"><b>${esc(x.question)}</b><ol type="A">${x.options.map(o=>`<li>${esc(o)}</li>`).join('')}</ol></div>`).join('')||'<p class="muted">No questions yet.</p>'}function startQuiz(){if(!questions.length)return alert('Import some questions first.');let x=questions[Math.floor(Math.random()*questions.length)];$('quizArea').innerHTML=`<p class="q">${esc(x.question)}</p>`+x.options.map((o,i)=>`<div class="opt" onclick="this.classList.add('${x.answer===String.fromCharCode(65+i)?'good':'bad'}')">${String.fromCharCode(65+i)}. ${esc(o)}</div>`).join('')}
render();
</script></body></html>
