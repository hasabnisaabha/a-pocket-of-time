<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Pocket of Time</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Kalam:wght@300;400&display=swap');

:root {
  --paper: #f7eadb;
  --ink: #4b4742;
  --line: rgba(75,71,66,.34);
  --circle: #8d857b;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Kalam", cursive;
}

.page {
  width: 100%;
  max-width: 1080px;
  margin: auto;
  min-height: 100vh;
  padding: 44px 32px 90px;
  position: relative;
}

.menu {
  position: absolute;
  top: 28px;
  right: 38px;
  width: 32px;
  height: 32px;
  border: 0;
  padding: 4px;
  background: transparent;
  cursor: pointer;
}
.menu span {
  display: block;
  height: 1.5px;
  margin: 6px 0;
  background: var(--ink);
  opacity: .7;
}

.title {
  margin: 0;
  text-align: center;
  font-family: "Caveat", cursive;
  font-size: clamp(43px, 5vw, 70px);
  font-weight: 400;
}

.hero {
  display: block;
  width: min(390px, 43vw);
  min-width: 270px;
  margin: 10px auto 0;
}

/* Deliberately large empty area, matching your screenshot. */
.posts {
  margin-top: clamp(500px, 36vw, 570px);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 70px;
  padding: 0 20px;
}

.post {
  width: 116px;
  height: 116px;
  margin: auto;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--circle);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform .15s ease;
}
.post:hover { transform: translateY(-3px); }
.post:focus-visible { outline: 2px solid var(--ink); outline-offset: 5px; }
.post img {
  width: 94px;
  height: 94px;
  object-fit: contain;
}

.calendar-wrap {
  width: min(850px, 82%);
  margin: 300px auto 0;
}

.calendar {
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}

.month {
  height: 74px;
  display: grid;
  grid-template-columns: 70px 1fr 70px;
  align-items: center;
  border-bottom: 1px solid var(--line);
  text-align: center;
  font-family: "Caveat", cursive;
  font-size: 28px;
}

.arrow {
  border: 0;
  background: transparent;
  color: var(--ink);
  font-family: inherit;
  font-size: 32px;
  cursor: pointer;
}

.days, .dates {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.day {
  min-height: 45px;
  display: grid;
  place-items: center;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  font-size: 18px;
}
.day:last-child { border-right: 0; }

.dates { grid-auto-rows: 86px; }

.date {
  position: relative;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 8px 10px;
  font-size: 18px;
}
.date:nth-child(7n) { border-right: 0; }
.date:nth-last-child(-n+7) { border-bottom: 0; }

.entry {
  cursor: pointer;
}
.entry::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 13px;
  width: 13px;
  height: 13px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: var(--circle);
}

.legend {
  margin: 18px 0 0;
  text-align: center;
  font-family: "Caveat", cursive;
  font-size: 20px;
}
.legend-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 5px;
  border-radius: 50%;
  background: var(--circle);
}

.notice {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  padding: 9px 17px;
  border-radius: 18px;
  background: #625c55;
  color: #fffaf4;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
.notice.show { opacity: 1; }

@media (max-width: 700px) {
  .page { padding: 30px 18px 60px; }
  .menu { right: 18px; top: 18px; }
  .title { margin-top: 14px; }

  .hero {
    width: min(340px, 82vw);
    margin-top: 8px;
  }

  .posts {
    margin-top: 390px;
    gap: 20px;
    padding: 0;
  }
  .post { width: 76px; height: 76px; }
  .post img { width: 63px; height: 63px; }

  .calendar-wrap {
    width: 100%;
    margin-top: 190px;
  }
  .month {
    height: 58px;
    grid-template-columns: 48px 1fr 48px;
    font-size: 24px;
  }
  .day { min-height: 36px; font-size: 14px; }
  .dates { grid-auto-rows: 62px; }
  .date { padding: 6px; font-size: 14px; }
  .entry::after { width: 10px; height: 10px; bottom: 9px; }
}
</style>
</head>

<body>
<main class="page">
  <button class="menu" type="button" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>

  <h1 class="title">A Pocket of Time</h1>

  <!-- YOUR ORIGINAL DRAWING -->
  <img class="hero"
       src="assets/writing-circle.jpg"
       alt="Original pencil drawing of a person writing at a desk">

  <section class="posts" aria-label="Writing posts">
    <button class="post" type="button" data-title="Post 1" aria-label="Open post 1">
      <img src="assets/bottle-post.png" alt="">
    </button>
    <button class="post" type="button" data-title="Post 2" aria-label="Open post 2">
      <img src="assets/bottle-post.png" alt="">
    </button>
    <button class="post" type="button" data-title="Post 3" aria-label="Open post 3">
      <img src="assets/bottle-post.png" alt="">
    </button>
    <button class="post" type="button" data-title="Post 4" aria-label="Open post 4">
      <img src="assets/bottle-post.png" alt="">
    </button>
  </section>

  <section class="calendar-wrap" aria-label="Writing calendar">
    <div class="calendar">
      <div class="month">
        <button class="arrow" type="button" aria-label="Previous month">‹</button>
        <div>(Month)</div>
        <button class="arrow" type="button" aria-label="Next month">›</button>
      </div>

      <div class="days">
        <div class="day">Mon</div><div class="day">Tue</div><div class="day">Wed</div>
        <div class="day">Thu</div><div class="day">Fri</div><div class="day">Sat</div><div class="day">Sun</div>
      </div>

      <div class="dates">
        <div class="date"></div><div class="date"></div><div class="date"></div>
        <div class="date"></div><div class="date"></div><div class="date"></div><div class="date"></div>
        <div class="date"></div><div class="date"></div><div class="date"></div>
        <div class="date"></div><div class="date"></div><div class="date"></div><div class="date"></div>
        <div class="date"></div><div class="date"></div><div class="date"></div>
        <div class="date"></div><div class="date"></div><div class="date"></div><div class="date"></div>
        <div class="date"></div><div class="date"></div><div class="date"></div>
        <div class="date"></div><div class="date"></div><div class="date"></div><div class="date"></div>
        <div class="date"></div><div class="date"></div><div class="date"></div>
        <div class="date"></div><div class="date"></div><div class="date"></div><div class="date"></div>
      </div>
    </div>
    <p class="legend"><span class="legend-dot"></span>has an entry</p>
  </section>
</main>

<div class="notice" id="notice" aria-live="polite"></div>

<script>
const notice = document.getElementById("notice");

function notify(text) {
  notice.textContent = text;
  notice.classList.add("show");
  clearTimeout(window.__notice);
  window.__notice = setTimeout(() => notice.classList.remove("show"), 1500);
}

document.querySelectorAll(".post").forEach((post) => {
  post.addEventListener("click", () => notify(post.dataset.title + " will open here."));
});

document.querySelector(".menu").addEventListener("click", () => {
  notify("Menu will live here.");
});

document.querySelectorAll(".arrow").forEach((arrow) => {
  arrow.addEventListener("click", () => notify("Month navigation will live here."));
});
</script>
</body>
</html>
