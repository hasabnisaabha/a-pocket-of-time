<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Pocket of Time</title>
<style>
html,body{margin:0;min-height:100%;background:#f3e3d5}
body{display:flex;justify-content:center}
main{width:min(100%,1100px);padding:14px}
.artwork{position:relative;width:100%}
.drawing{display:block;width:100%;height:auto}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer}
.hotspot:focus-visible{outline:2px solid #8b6f52}
.one{left:20%;top:58%;width:9%;height:10%}
.two{left:29%;top:58%;width:9%;height:10%}
.three{left:39%;top:58%;width:9%;height:10%}
.four{left:48%;top:58%;width:9%;height:10%}
</style>
</head>
<body>
<main>
<div class="artwork">
<img class="drawing" src="pocket-drawing.jpg" alt="Original hand-drawn A Pocket of Time homepage artwork">
<button class="hotspot one" aria-label="Writing"></button>
<button class="hotspot two" aria-label="Memories"></button>
<button class="hotspot three" aria-label="Fragments"></button>
<button class="hotspot four" aria-label="About"></button>
</div>
</main>
</body>
</html>
